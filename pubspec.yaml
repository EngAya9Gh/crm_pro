name: crm_wakeel
description: "Wakeel CRM - Professional Business Management"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.6
  
  # Dependency Injection
  get_it: ^7.7.0
  
  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  shimmer: ^3.0.0
  
  # Networking
  dio: ^5.5.0+1
  
  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  file_picker: ^10.3.8
  path_provider: ^2.1.5
  open_filex: ^4.3.2
  flutter_native_splash: ^2.4.4
  mobile_scanner: ^5.0.0
  pusher_channels_flutter: ^2.6.0
  emoji_picker_flutter: ^4.4.0
  record: ^6.2.1
  permission_handler: ^11.3.1
  audioplayers: ^6.7.1
  dropdown_search: ^7.0.0
  dropdown_button2: ^2.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon_dark.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1E1E1E" # AppColorScheme.secondary
  android_12:
    color: "#1E1E1E"
  web: false
  fullscreen: true

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
